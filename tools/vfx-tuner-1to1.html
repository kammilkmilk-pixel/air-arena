<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>🎯 1:1 空戰 VFX 調校台 - 搭載物理火花與風壓引擎</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: monospace; color: #fff; user-select: none; }
        
        #control-panel {
            position: absolute; top: 15px; left: 15px; z-index: 100;
            background: rgba(10,10,10,0.96); border: 1px solid #333; padding: 15px;
            border-radius: 8px; width: 360px; box-shadow: 0 0 30px rgba(0,0,0,1);
            max-height: 90vh; overflow-y: auto;
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

        .section-title { font-size: 13px; color: #00ff88; margin: 18px 0 10px 0; border-bottom: 1px solid #333; padding-bottom: 5px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .slider-group { margin-bottom: 14px; }
        label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 5px; color: #aaa; }
        .val-display { color: #fff; font-weight: bold; background: #222; padding: 1px 5px; border-radius: 3px; }
        input[type="range"] { width: 100%; accent-color: #00ff88; cursor: pointer; }
        select { width: 100%; padding: 7px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px; margin-bottom: 12px; font-family: monospace; outline: none; }
        select:focus { border-color: #00ff88; }
        
        #btn-fire {
            width: 100%; background: #ff0055; color: #fff; border: none; padding: 12px;
            font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 10px;
            box-shadow: 0 4px 0 #990033; transition: all 0.1s;
        }
        #btn-fire:hover { background: #ff1a66; }
        #btn-fire:active { box-shadow: 0 0px 0 #990033; transform: translateY(4px); }

        #code-output-container { margin-top: 20px; }
        #code-output {
            background: #000; border: 1px solid #444; padding: 12px; border-radius: 5px;
            font-size: 11px; color: #00ffff; word-wrap: break-word; user-select: text;
            font-family: 'Courier New', monospace; white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <div id="control-panel">
        <h2 style="margin-top:0; font-size: 18px; text-align: center; color: #fff; border-bottom: 2px solid #ff0055; padding-bottom: 10px;">VFX 精細調校儀</h2>
        
        <div class="section-title">📺 貼圖/基底設定 (render.js)</div>
        <div class="slider-group"><label>Puff 基底尺寸 (PuffGeo) <span class="val-display" id="val-geo-puff">2.0</span></label><input type="range" id="sl-geo-puff" min="0.5" max="5.0" value="2.0" step="0.1"></div>
        <div class="slider-group"><label>Flipbook 貼圖顏色基底 <span class="val-display" id="val-base-color">#dddddd</span></label><input type="color" id="sl-base-color" value="#dddddd" style="width:100%; border:none; background:none; cursor:pointer;"></div>

        <div class="section-title">✨ 拉絲火花物理設定 (Sparks Logic)</div>
        <div class="slider-group"><label>火花數量 <span class="val-display" id="val-spark-count">100</span></label><input type="range" id="sl-spark-count" min="10" max="300" value="100" step="1"></div>
        <div class="slider-group"><label>爆炸起始速度 (Power) <span class="val-display" id="val-spark-vel">0.45</span></label><input type="range" id="sl-spark-vel" min="0.05" max="1.5" value="0.45" step="0.01"></div>
        <div class="slider-group"><label>拉絲長度倍率 (Streak) <span class="val-display" id="val-spark-streak">1.50</span></label><input type="range" id="sl-spark-streak" min="0.1" max="5.0" value="1.50" step="0.05"></div>
        <div class="slider-group"><label>空氣阻力 (Air Drag) <span class="val-display" id="val-spark-drag">0.960</span></label><input type="range" id="sl-spark-drag" min="0.8" max="0.999" value="0.960" step="0.001"></div>
        <div class="slider-group"><label>重力下墜 (Gravity) <span class="val-display" id="val-spark-grav">0.005</span></label><input type="range" id="sl-spark-grav" min="0" max="0.02" value="0.005" step="0.001"></div>
        <div class="slider-group"><label>💨 向後風壓 (Wind Force) <span class="val-display" id="val-spark-wind">0.080</span></label><input type="range" id="sl-spark-wind" min="0" max="0.3" value="0.080" step="0.005"></div>
        <div class="slider-group"><label>火花生命週期 (壽命) <span class="val-display" id="val-spark-life">40</span></label><input type="range" id="sl-spark-life" min="10" max="120" value="40" step="1"></div>

        <div class="section-title">🎬 劇本觸發設定 (combat.js)</div>
        <select id="sel-type">
            <option value="machinegun">💥 機砲命中 (火花+小煙)</option>
            <option value="missile">💥 飛彈爆炸 (大煙+火花)</option>
        </select>
        <div class="slider-group"><label>Puff 縮放倍率 (Scale) <span class="val-display" id="val-scale">1.0</span></label><input type="range" id="sl-scale" min="0.1" max="4.0" value="1.0" step="0.1"></div>
        <div class="slider-group"><label>Puff 透明濃度 (Opacity) <span class="val-display" id="val-opacity">0.8</span></label><input type="range" id="sl-opacity" min="0.05" max="1.0" value="0.8" step="0.05"></div>

        <button id="btn-fire">▶ 在機身引爆測試</button>

        <div id="code-output-container">
            <div class="section-title" style="color: #00ffff;">📋 物理設定 (貼至 render.js 物理區)</div>
            <div id="code-output-config">// 點擊測試播放生成代碼</div>
            
            <div class="section-title" style="color: #ffff00; margin-top:15px;">📋 劇本觸發 (貼至 combat.js)</div>
            <div id="code-output">// 點擊測試播放生成代碼</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        // 1. 初始化 3D 空間
        const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0a0a0a);
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.5, 6);
        const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.outputEncoding = THREE.sRGBEncoding;
        document.body.appendChild(renderer.domElement);
        const controls = new THREE.OrbitControls(camera, renderer.domElement); controls.enableDamping = true;
        scene.add(new THREE.GridHelper(20, 20, 0x222222, 0x111111));
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.0); dirLight.position.set(5, 10, 5); scene.add(dirLight);

        // ✈️ 載入 1:1 真實戰機模型
        const planeRef = new THREE.Group(); scene.add(planeRef);
        new THREE.GLTFLoader().load('../assets/models/mig21_red.glb', (gltf) => {
            const model = gltf.scene; const box = new THREE.Box3().setFromObject(model); const size = box.getSize(new THREE.Vector3());
            const scale = 1.2 / Math.max(size.x, size.y, size.z); model.scale.set(scale, scale, scale);
            const center = box.getCenter(new THREE.Vector3()); model.position.set(-center.x * scale, -center.y * scale, -center.z * scale);
            model.traverse(c => { if (c.isMesh && c.material) { c.material = c.material.clone(); if (c.material.color) { let orig = c.material.color; c.material.color.setRGB(orig.r * 0.3, orig.g * 0.3, orig.b * 0.3); } } });
            planeRef.add(model);
        });

        // 🖼️ Sprite Manager (煙霧)
        class SpriteManager {
            constructor() { this.texture = null; this.frameData = []; this.isReady = false; }
            init(jsonPath, pngPath) {
                new THREE.FileLoader().load(jsonPath, (jsonData) => {
                    const data = JSON.parse(jsonData); const meta = data.meta;
                    this.frameData = Object.keys(data.frames).map(k => { const f = data.frames[k].frame; return [ f.x/meta.size.w, (f.x+f.w)/meta.size.w, (meta.size.h-(f.y+f.h))/meta.size.h, (meta.size.h-f.y)/meta.size.h ]; });
                    this.texture = new THREE.TextureLoader().load(pngPath, () => { this.isReady = true; });
                });
            }
        }
        const mgrPuff = new SpriteManager(); mgrPuff.init('../assets/vfx/puff_flipbook.json', '../assets/vfx/puff_flipbook.png');
        const matPuff = new THREE.MeshBasicMaterial({ transparent: true, blending: THREE.NormalBlending, depthWrite: false, side: THREE.DoubleSide, color: 0xdddddd });
        const checkPuffReady = setInterval(() => { if(mgrPuff.isReady) { matPuff.map = mgrPuff.texture; clearInterval(checkPuffReady); } }, 100);
        const geoPuffShared = new THREE.PlaneGeometry(2, 2);
        const meshPuff = new THREE.Mesh(geoPuffShared, matPuff); meshPuff.visible = false; scene.add(meshPuff);

        // ============================================================================
        // ✨ 拉絲火花物理引擎
        // ============================================================================
        const genSparkTexture = () => {
            const canvas = document.createElement('canvas'); canvas.width = 32; canvas.height = 128; 
            const ctx = canvas.getContext('2d');
            const grad = ctx.createLinearGradient(16, 0, 16, 128);
            grad.addColorStop(0.0, 'transparent'); grad.addColorStop(0.1, '#ffffff'); 
            grad.addColorStop(0.3, '#ffcc00'); grad.addColorStop(0.6, '#ff4400'); 
            grad.addColorStop(1.0, 'transparent');
            ctx.fillStyle = grad; ctx.fillRect(0, 0, 32, 128);
            const tex = new THREE.CanvasTexture(canvas); tex.encoding = THREE.sRGBEncoding; return tex;
        };

        const MAX_SPARKS_LIMIT = 300;
        const sparksPool = [];
        const sparkGeo = new THREE.PlaneGeometry(0.06, 1.0); 
        sparkGeo.rotateX(Math.PI / 2); 
        const sparkMat = new THREE.MeshBasicMaterial({ map: genSparkTexture(), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });

        for (let i = 0; i < MAX_SPARKS_LIMIT; i++) {
            const mesh = new THREE.Mesh(sparkGeo, sparkMat); mesh.visible = false; mesh.frustumCulled = false; scene.add(mesh);
            sparksPool.push({ mesh: mesh, vel: new THREE.Vector3(), life: 0, maxLife: 0, active: false });
        }

        let sparkConfig = { count: 100, vel: 0.45, streak: 1.5, drag: 0.960, grav: 0.005, wind: 0.080, life: 40 };

        const updateSparksPhysics = () => {
            for (let s of sparksPool) {
                if (!s.active) continue;
                s.life--; if (s.life <= 0) { s.active = false; s.mesh.visible = false; continue; }

                s.vel.multiplyScalar(sparkConfig.drag); 
                s.vel.y -= sparkConfig.grav; 
                
                // 💨 加入向後風壓 (負 Z 軸方向)
                s.vel.z -= sparkConfig.wind * 0.05; 
                
                s.mesh.position.add(s.vel); 

                const currentVelLen = s.vel.length();
                if (currentVelLen > 0.001) {
                    const tempAxis = s.vel.clone().normalize();
                    const quaternion = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), tempAxis);
                    s.mesh.quaternion.copy(quaternion);
                    const sLen = 0.5 + (currentVelLen * 15 * sparkConfig.streak);
                    s.mesh.scale.set(1, sLen, 1);
                }

                const ratio = s.life / s.maxLife; s.mesh.material.opacity = Math.pow(ratio, 1.5);
            }
        };

        const triggerSparkExplosion = (pos) => {
            let countToEmit = Math.min(sparkConfig.count, MAX_SPARKS_LIMIT);
            let poolIdx = 0;
            while (countToEmit > 0 && poolIdx < MAX_SPARKS_LIMIT) {
                let s = sparksPool[poolIdx];
                if (!s.active) {
                    s.active = true; s.mesh.visible = true; s.mesh.position.copy(pos);
                    const phi = Math.random() * Math.PI * 2; const theta = Math.acos(Math.random() * 2 - 1);
                    s.vel.set(Math.sin(theta)*Math.cos(phi), Math.sin(theta)*Math.sin(phi), Math.cos(theta));
                    const pwr = sparkConfig.vel * (0.8 + Math.random() * 0.4); s.vel.multiplyScalar(pwr);
                    s.maxLife = s.life = sparkConfig.life * (0.8 + Math.random() * 0.4);
                    countToEmit--;
                }
                poolIdx++;
            }
        };

        // ============================================================================
        // 動態調校與 UI 綁定
        // ============================================================================
        const UI = {
            geoPuff: document.getElementById('sl-geo-puff'), baseColor: document.getElementById('sl-base-color'),
            skCount: document.getElementById('sl-spark-count'), skVel: document.getElementById('sl-spark-vel'), skStreak: document.getElementById('sl-spark-streak'), 
            skDrag: document.getElementById('sl-spark-drag'), skGrav: document.getElementById('sl-spark-grav'), skWind: document.getElementById('sl-spark-wind'), skLife: document.getElementById('sl-spark-life'),
            selType: document.getElementById('sel-type'), scale: document.getElementById('sl-scale'), opacity: document.getElementById('sl-opacity')
        };

        UI.geoPuff.addEventListener('input', (e) => { document.getElementById('val-geo-puff').innerText = parseFloat(e.target.value).toFixed(1); geoPuffShared.dispose(); geoPuffShared.copy(new THREE.PlaneGeometry(UI.geoPuff.value, UI.geoPuff.value)); });
        UI.baseColor.addEventListener('input', (e) => { document.getElementById('val-base-color').innerText = e.target.value; matPuff.color.set(e.target.value); });

        ['skCount', 'skVel', 'skStreak', 'skDrag', 'skGrav', 'skWind', 'skLife'].forEach(key => {
            UI[key].addEventListener('input', (e) => {
                let valStr = parseFloat(e.target.value).toFixed(key==='skDrag' || key==='skGrav' || key==='skWind' ? 3 : (key==='skCount' || key==='skLife' ? 0 : 2));
                document.getElementById('val-' + key.replace('sk', 'spark-').toLowerCase()).innerText = valStr;
                sparkConfig[key.replace('sk', '').toLowerCase()] = parseFloat(e.target.value);
            });
        });
        ['scale', 'opacity'].forEach(key => { UI[key].addEventListener('input', (e) => { document.getElementById('val-' + key).innerText = parseFloat(e.target.value).toFixed(1); }); });

        // ============================================================================
        // 播放與動畫循環
        // ============================================================================
        let puffAnim = { isPlaying: false, frame: 0, scale: 1, opacity: 0.8, startPos: new THREE.Vector3() };
        document.getElementById('btn-fire').addEventListener('click', () => {
            const comboType = UI.selType.value; 
            const centerPos = new THREE.Vector3(0, 0, -1.0); // 稍微往機頭靠一點的引爆點

            triggerSparkExplosion(centerPos);
            puffAnim = { isPlaying: true, frame: 0, scale: (comboType === 'machinegun' ? 1.0 : 2.5) * UI.scale.value, opacity: (comboType === 'machinegun' ? 0.6 : 1.0), startPos: centerPos.clone() };

            let codeConf = `// 將此區塊貼至你的視覺設定區 (例如 config.js 底部)
sparksParams: {
  count: ${sparkConfig.count.toFixed(0)},    
  velocity: ${sparkConfig.vel.toFixed(2)},  
  streak: ${sparkConfig.streak.toFixed(2)},    
  drag: ${sparkConfig.drag.toFixed(3)},      
  gravity: ${sparkConfig.grav.toFixed(3)},   
  wind: ${sparkConfig.wind.toFixed(3)},      // 💨 向後風壓
  life: ${sparkConfig.life.toFixed(0)}         
}`;
            document.getElementById('code-output-config').innerHTML = codeConf;
            let code = `logEntry.vfxTriggers.push({\n  type: 'spark_explosion',\n  step: step, pos: activePos.clone()\n});\n// 搭配 Puff:\nlogEntry.vfxTriggers.push({\n  type: 'puff', step: step, pos: activePos.clone(),\n  scale: ${puffAnim.scale.toFixed(1)}, opacity: ${UI.opacity.value.toFixed(2)}\n});`;
            document.getElementById('code-output').innerHTML = code;
        });

        const animate = () => {
            requestAnimationFrame(animate); controls.update();

            updateSparksPhysics();

            if (puffAnim.isPlaying && mgrPuff.isReady) {
                const maxLife = 60; const ageFrames = puffAnim.frame;
                if (ageFrames < maxLife) {
                    // 💨 濃煙也受到風壓影響，隨時間被往後方(負Z)拖曳
                    let currentZ = puffAnim.startPos.z - (ageFrames * sparkConfig.wind * 0.15);
                    meshPuff.position.set(puffAnim.startPos.x, puffAnim.startPos.y, currentZ);

                    meshPuff.quaternion.copy(camera.quaternion); meshPuff.quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), ageFrames * 0.03));
                    let lifeRatio = ageFrames / maxLife; let s = (0.5 + (lifeRatio * 2.5)) * puffAnim.scale; meshPuff.scale.set(s, s, s);
                    meshPuff.material.opacity = (1.0 - Math.pow(lifeRatio, 2)) * UI.opacity.value * puffAnim.opacity;
                    let tileIdx = Math.floor(lifeRatio * mgrPuff.frameData.length); if (tileIdx >= mgrPuff.frameData.length) tileIdx = mgrPuff.frameData.length - 1;
                    if (mgrPuff.frameData[tileIdx]) { const uv = mgrPuff.frameData[tileIdx]; const uvAttr = meshPuff.geometry.attributes.uv; uvAttr.setXY(0, uv[0], uv[3]); uvAttr.setXY(1, uv[1], uv[3]); uvAttr.setXY(2, uv[0], uv[2]); uvAttr.setXY(3, uv[1], uv[2]); uvAttr.needsUpdate = true; meshPuff.visible = true; }
                    puffAnim.frame += 1.0;
                } else { meshPuff.visible = false; puffAnim.isPlaying = false; }
            }
            renderer.render(scene, camera);
        }; animate();
        window.onresize = () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); };
    </script>
</body>
</html>
